# ============================================================
# Nginx Production Configuration
# Optimized for Hostinger VPS: 2 vCPU, 4 GB RAM, Ubuntu 24.04
#
# This file should be placed at /etc/nginx/sites-available/ethionikah
# and symlinked to /etc/nginx/sites-enabled/
#
# Usage:
#   sudo cp nginx.conf /etc/nginx/sites-available/ethionikah
#   sudo ln -s /etc/nginx/sites-available/ethionikah /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
# ============================================================

# Rate limiting zone — 10 requests/sec per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Connection limiting — max 20 simultaneous connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream definitions
# ip_hash ensures Socket.io sticky sessions for PM2 cluster mode
upstream backend_api {
    ip_hash;
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream frontend_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name ethionikah.com www.ethionikah.com admin.ethionikah.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ethionikah.com www.ethionikah.com admin.ethionikah.com;

    # SSL certificates — use Let's Encrypt (certbot)
    # ssl_certificate /etc/letsencrypt/live/ethionikah.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ethionikah.com/privkey.pem;

    # SSL optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        image/svg+xml;

    # Client body limits — reject oversized payloads early
    client_max_body_size 6M;
    client_body_buffer_size 16k;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Keepalive tuning
    keepalive_timeout 65s;
    keepalive_requests 100;

    # Proxy buffering
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # WebSocket support (Socket.io)
    location /socket.io/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout tuning
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API routes — proxy to Express backend
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Never cache API responses — prevent cross-user data leakage
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Static uploads — serve directly from Nginx (bypass Node.js)
    location /uploads/ {
        alias /var/www/ethionikah/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Prevent script execution in uploads directory
        location ~ \.(php|js|sh|py|rb|pl|cgi|asp|aspx|jsp)$ {
            deny all;
        }
    }

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://frontend_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # All other routes — proxy to Next.js frontend
    # Authenticated pages must never be cached by browser or proxy
    location / {
        proxy_pass http://frontend_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent caching of authenticated/dynamic pages
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://backend_api;
        access_log off;
    }

    # Block sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
